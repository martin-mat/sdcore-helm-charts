name: mongodb diag
on: {push: {branches: [mongodb-diag]}}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: kind create cluster --config .github/cnti/kind-3workers.yaml --wait 120s
      - name: install
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build 5g-control-plane
          helm dependency build sdcore-helm-charts
          S="--set 5g-control-plane.resources"
          helm install sd-core sdcore-helm-charts -n sdcore --create-namespace --set omec-user-plane.enable=false --set 5g-ran-sim.enable=false --set 5g-control-plane.kafka.deploy=false $S.amf.requests.cpu=100m $S.ausf.requests.cpu=100m $S.nrf.requests.cpu=100m $S.nssf.requests.cpu=100m $S.pcf.requests.cpu=100m $S.smf.requests.cpu=100m $S.udm.requests.cpu=100m $S.udr.requests.cpu=100m $S.webui.requests.cpu=100m $S.upfadapter.requests.cpu=100m --set omec-sub-provision.resources.simapp.requests.cpu=100m --set 5g-control-plane.mongodb.resources.requests.cpu=250m --wait --timeout 10m
          sleep 30; kubectl get pods -n sdcore -o wide
          echo "--- webui probes:"; kubectl get deploy -n sdcore webui -o jsonpath='{range .spec.template.spec.containers[0]}startup={.startupProbe}{"\n"}liveness={.livenessProbe}{"\n"}readiness={.readinessProbe}{"\n"}{end}'
          echo "--- simapp probes:"; kubectl get deploy -n sdcore simapp -o jsonpath='{range .spec.template.spec.containers[0]}startup={.startupProbe}{"\n"}{end}'
      - name: drain the primary's node, restart webui with it
        run: |
          set -u; ns=sdcore; mkdir -p /tmp/diag
          rs() { for m in mongodb-0 mongodb-1; do o=$(kubectl exec -n $ns $m -c mongodb -- mongosh --quiet --eval 'rs.status().members.map(m=>m.name.split(".")[0]+"="+m.stateStr).join(" ")' 2>/dev/null) && { echo "$o"; return; }; done; echo "no answer"; }
          prim=$(rs | grep -oE 'mongodb-[01]=PRIMARY' | cut -d= -f1); node=$(kubectl get pod -n $ns $prim -o jsonpath='{.spec.nodeName}')
          echo "primary $prim on $node; replica set: $(rs)"
          kubectl get pods -n $ns -o wide --no-headers | awk -v n=$node '$7==n{print "  on that node: "$1}'
          t0=$(date +%s)
          kubectl drain $node --ignore-daemonsets --delete-emptydir-data --timeout=180s > /tmp/diag/drain.log 2>&1 &
          kubectl get pods -n $ns -o wide --no-headers | awk -v n=$node '$7==n{print $1}' | grep -q '^webui-' || kubectl delete pod -n $ns -l app=webui --wait=false
          for i in $(seq 1 48); do
            w=$(kubectl get pods -n $ns -l app=webui -o jsonpath='{range .items[*]}{.metadata.name} ready={.status.containerStatuses[0].ready} restarts={.status.containerStatuses[0].restartCount} {.status.containerStatuses[0].state}{"\n"}{end}' | tr '\n' ';' | cut -c1-230)
            s=$(kubectl get pods -n $ns -l app=simapp -o jsonpath='{range .items[*]}ready={.status.containerStatuses[0].ready} restarts={.status.containerStatuses[0].restartCount};{end}')
            echo "+$(( $(date +%s) - t0 ))s rs[$(rs)] webui[$w] simapp[$s]"
            sleep 5
          done | tee /tmp/diag/timeline.log
          wait
      - name: logs and events
        if: always()
        run: |
          ns=sdcore
          for d in webui simapp; do
            for p in $(kubectl get pods -n $ns -l app=$d -o name); do
              kubectl logs -n $ns $p --previous > /tmp/diag/$d-previous.log 2>&1 || true
              kubectl logs -n $ns $p > /tmp/diag/$d-current.log 2>&1 || true
            done
            echo "=== $d previous (tail)"; tail -25 /tmp/diag/$d-previous.log | tr '\t' ' ' | cut -c1-220
            echo "=== $d current (tail)"; tail -25 /tmp/diag/$d-current.log | tr '\t' ' ' | cut -c1-220
          done
          kubectl get events -n $ns --sort-by=.lastTimestamp > /tmp/diag/events.log
          echo "=== events (webui/simapp/mongodb)"; grep -E "webui|simapp|mongodb" /tmp/diag/events.log | tail -40 | cut -c1-230
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: diag, path: /tmp/diag}
  node-drain-3workers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build 5g-control-plane
          helm dependency build sdcore-helm-charts
      - uses: lfn-cnti/testsuite-action@05a9860905f31c6813f735d25e5cefd7c62a1e5a # v1.1.0
        with:
          version: v2.1.0
          cnf_config: .github/cnti/cnti-testsuite.yaml
          kind_config: .github/cnti/kind-3workers.yaml
          tests: node_drain
          fail_on_failure: false
