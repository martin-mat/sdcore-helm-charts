name: mongodb verify
on: {push: {branches: [mongodb-verify]}}
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > kind.yaml <<'K'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes: [{role: control-plane}, {role: worker}, {role: worker}, {role: worker}]
          K
          kind create cluster --config kind.yaml --wait 120s
      - name: install
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build 5g-control-plane
          helm dependency build sdcore-helm-charts
          S="--set 5g-control-plane.resources"
          helm install sd-core sdcore-helm-charts -n sdcore --create-namespace --set omec-user-plane.enable=false --set 5g-ran-sim.enable=false --set 5g-control-plane.kafka.deploy=false $S.amf.requests.cpu=100m $S.ausf.requests.cpu=100m $S.nrf.requests.cpu=100m $S.nssf.requests.cpu=100m $S.pcf.requests.cpu=100m $S.smf.requests.cpu=100m $S.udm.requests.cpu=100m $S.udr.requests.cpu=100m $S.webui.requests.cpu=100m $S.upfadapter.requests.cpu=100m --set omec-sub-provision.resources.simapp.requests.cpu=100m --set 5g-control-plane.mongodb.resources.requests.cpu=250m --wait --timeout 10m
          sleep 30; kubectl get pods -n sdcore -o wide | grep -E "mongo|NAME"
      - name: drain each member's node
        run: |
          set -u; ns=sdcore
          rs() { kubectl exec -n $ns mongodb-0 -c mongodb -- mongosh --quiet --eval 'rs.status().members.map(m=>m.name.split(".")[0]+"="+m.stateStr).join(" ")' 2>/dev/null || kubectl exec -n $ns mongodb-1 -c mongodb -- mongosh --quiet --eval 'rs.status().members.map(m=>m.name.split(".")[0]+"="+m.stateStr).join(" ")' 2>/dev/null; }
          echo "replica set: $(rs)"
          for m in mongodb-0 mongodb-1; do
            node=$(kubectl get pod -n $ns $m -o jsonpath='{.spec.nodeName}')
            echo "=== drain $node (holds $m; also: $(kubectl get pods -n $ns -o wide --no-headers | awk -v n=$node '$7==n{print $1}' | grep -E 'mongo|nrf|udr|webui|simapp' | tr '\n' ' '))"
            t0=$(date +%s); kubectl drain $node --ignore-daemonsets --delete-emptydir-data --timeout=180s >/dev/null 2>&1 && echo "drained" || echo "drain did not finish"
            sleep 5; echo "replica set during: $(rs)"
            if kubectl wait -n $ns --for=condition=Ready pods --all --timeout=300s >/dev/null 2>&1; then echo "all pods Ready $(( $(date +%s) - t0 )) s after the drain started"; else echo "NOT all Ready:"; kubectl get pods -n $ns | grep -v "1/1"; fi
            echo "replica set after: $(rs)"
            kubectl get pods -n $ns -o wide | grep mongo
            kubectl uncordon $node >/dev/null
          done
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build 5g-control-plane
          helm dependency build sdcore-helm-charts
      - uses: lfn-cnti/testsuite-action@05a9860905f31c6813f735d25e5cefd7c62a1e5a # v1.1.0
        with:
          version: v2.1.0
          cnf_config: .github/cnti/cnti-testsuite.yaml
          tests: cert
          fail_on_failure: false
