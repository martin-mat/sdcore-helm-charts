name: CNTi certification (control plane)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnti-certification
  cancel-in-progress: false

jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Twelve workloads share the runner's four cores: scaling and
      # rollouts take longer than the suite's 60-second default.
      CNTI_TESTSUITE_GENERIC_OPERATION_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4

      # The umbrella depends on the sibling charts by file:// reference and
      # 5g-control-plane pulls MongoDB and Kafka from Bitnami, so both
      # dependency sets are built before the suite installs the chart.
      - name: Build chart dependencies
        run: |
          set -euo pipefail
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build 5g-control-plane
          helm dependency build sdcore-helm-charts

      # NRF of the chart's release (v3.1.2) with only omec-project/util
      # replaced by the commit of omec-project/util#310, so the run shows
      # that change alone. The other functions keep their released images
      # and serve as the control.
      - name: Build the NRF with util#310
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.1.2 https://github.com/omec-project/nrf.git nrf-src
          docker run --rm -v "$PWD/nrf-src:/src" -w /src golang:1.26 sh -c \
            'go mod edit -replace github.com/omec-project/util=github.com/martin-mat/util@c5ab1de && go mod tidy && grep -n "martin-mat/util" go.mod'
          docker build -t ghcr.io/omec-project/5gc-nrf:util-310 nrf-src
          rm -rf nrf-src

      - uses: lfn-cnti/testsuite-action@v1
        with:
          version: v2.0.0
          cnf_config: cnti-testsuite.yaml
          install_timeout: 900
          tests: cert
          kind_load_images: ghcr.io/omec-project/5gc-nrf:util-310

      # util#310: what the NRF (built with it) and the AMF (released image)
      # log through the HTTP server's error log. First over the whole log,
      # then after a probe-like connect-and-close and a peer that does not
      # speak TLS, sent to each SBI port from a pod.
      - name: util#310 checks
        if: always()
        run: |
          set +e
          summary() {
            for nf in nrf amf; do
              logs=$(kubectl logs -n sdcore deploy/$nf 2>/dev/null)
              printf '%-4s lines=%-5s stdlib-format=%-4s handshake-EOF=%-4s util-category=%s\n' "$nf" \
                "$(printf '%s\n' "$logs" | wc -l)" \
                "$(printf '%s\n' "$logs" | grep -cE '^[0-9]{4}/[0-9]{2}/[0-9]{2} ')" \
                "$(printf '%s\n' "$logs" | grep -cE 'TLS handshake error from .*: EOF$')" \
                "$(printf '%s\n' "$logs" | grep -c '"category": "Util"')"
            done
          }
          echo "::group::whole log, before the test"; summary; echo "::endgroup::"
          for nf in nrf amf; do kubectl logs -n sdcore deploy/$nf 2>/dev/null | wc -l > /tmp/$nf.before; done
          kubectl run tls-check -n sdcore --image=busybox:1.36 --restart=Never --command -- sh -c '
            for t in nrf:29510 amf:29518; do
              h=${t%:*}; p=${t#*:}
              nc -z -w 3 $h $p && echo "$t: connect-and-close sent"
              printf "\000\001\002\003\004\005\006\007\010\011" | nc -w 3 $h $p; echo "$t: non-TLS bytes sent"
            done'
          kubectl wait -n sdcore --for=jsonpath='{.status.phase}'=Succeeded pod/tls-check --timeout=120s
          kubectl logs -n sdcore tls-check
          sleep 5
          for nf in nrf amf; do
            echo "::group::$nf: new lines from the server error log"
            kubectl logs -n sdcore deploy/$nf 2>/dev/null | tail -n +$(( $(cat /tmp/$nf.before) + 1 )) | grep -E 'TLS handshake|^[0-9]{4}/[0-9]{2}/[0-9]{2} |"category": "Util"'
            echo "::endgroup::"
          done
          echo "::group::whole log, after the test"; summary; echo "::endgroup::"
          kubectl delete pod -n sdcore tls-check --wait=false

      # How much each function logs because of its probes: a TCP probe on a
      # TLS port logs "http: TLS handshake error ... EOF" per connection.
      - name: Probe log noise
        if: always()
        run: |
          set +e
          printf '%-40s %8s %10s %8s\n' pod lines handshake restarts
          for pod in $(kubectl get pods -n sdcore -o name); do
            logs=$(kubectl logs -n sdcore "$pod" --all-containers 2>/dev/null)
            restarts=$(kubectl get -n sdcore "$pod" -o jsonpath='{range .status.containerStatuses[*]}{.restartCount}{" "}{end}')
            printf '%-40s %8s %10s %8s\n' "${pod#pod/}" "$(printf '%s\n' "$logs" | wc -l)" "$(printf '%s\n' "$logs" | grep -c 'TLS handshake error')" "$restarts"
          done
          echo "::group::probe failures (Unhealthy events)"; kubectl get events -n sdcore --field-selector reason=Unhealthy -o custom-columns=OBJ:.involvedObject.name,COUNT:.count,MSG:.message --no-headers | sort | uniq | head -60; echo "::endgroup::"

      # Why did a function not come up? Pod state, events and logs from the
      # kind cluster the action created; it lives until the job ends.
      - name: Diagnostics
        if: always()
        run: |
          set +e
          echo "::group::mongodb logs"; for p in $(kubectl get pods -n sdcore -o name | grep mongodb); do echo "--- $p (current)"; kubectl logs -n sdcore "$p" --tail=80; echo "--- $p (previous)"; kubectl logs -n sdcore "$p" --previous --tail=80 2>/dev/null; done; echo "::endgroup::"
          echo "::group::restart and probe events"; kubectl get events -A --field-selector reason=BackOff -o wide | tail -30; kubectl get events -A --field-selector reason=Unhealthy -o wide | tail -40; echo "::endgroup::"
          echo "::group::pods"; kubectl get pods -A -o wide; echo "::endgroup::"
          echo "::group::node allocation"; kubectl describe nodes | grep -A9 "Allocated resources"; echo "::endgroup::"
          for pod in $(kubectl get pods -n sdcore -o name); do
            echo "::group::describe $pod"; kubectl describe -n sdcore "$pod" | tail -60; echo "::endgroup::"
            echo "::group::logs $pod"; kubectl logs -n sdcore "$pod" --all-containers --tail=60; echo "::endgroup::"
          done
          echo "::group::events"; kubectl get events -n sdcore --sort-by=.lastTimestamp | tail -60; echo "::endgroup::"
