name: mongodb layout diag
on: {push: {branches: [mongo-layout-diag]}}
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        layout: [psa, pss]
    name: ${{ matrix.layout }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build 5g-control-plane
          helm dependency build sdcore-helm-charts
      - name: Recorder
        run: |
          mkdir -p /tmp/diag/logs
          nohup bash -c 'while true; do
            for p in $(kubectl get pods -n sdcore -l "app in (webui,simapp)" -o name 2>/dev/null) $(kubectl get pods -n sdcore -l app.kubernetes.io/name=mongodb -o name 2>/dev/null); do n=${p#pod/}
              kubectl logs -n sdcore $p --timestamps --all-containers > /tmp/diag/logs/$n.log 2>/dev/null
              kubectl logs -n sdcore $p --previous --timestamps --all-containers > /tmp/diag/logs/$n.previous.log 2>/dev/null || rm -f /tmp/diag/logs/$n.previous.log
            done
            { echo "=== $(date -u +%T)"
              kubectl get pods -n sdcore -o wide --no-headers 2>/dev/null | grep -E "webui|simapp|mongodb" | awk "{print \$1, \$2, \$3, \$4, \$7}"
              for m in mongodb-0 mongodb-1 mongodb-2; do
                o=$(timeout 8 kubectl exec -n sdcore $m -c mongodb -- mongosh --quiet --eval "const s=rs.status(); print(\"rs: \"+s.members.map(x=>x.name.split(\".\")[0]+\"=\"+x.stateStr).join(\" \")); if (db.hello().isWritablePrimary) { const ops=db.getSiblingDB(\"admin\").currentOp({active:true, secs_running:{\$gte:3}}).inprog.map(o=>(o.desc||o.op)+\" \"+(o.ns||\"\")+\" \"+Object.keys(o.command||{})[0]+\" \"+o.secs_running+\"s\"+(o.msg?\" [\"+o.msg+\"]\":\"\")+(o.waitingForLatch?\" latch\":\"\")); print(\"ops on primary \"+\"$m\"+\": \"+(ops.length?ops.join(\" | \"):\"none\")) }" 2>/dev/null) && { echo "$o"; break; }
              done
            } >> /tmp/diag/status.log 2>&1
            sleep 5; done' >/dev/null 2>&1 &
      - uses: lfn-cnti/testsuite-action@05a9860905f31c6813f735d25e5cefd7c62a1e5a # v1.1.0
        with:
          version: v2.1.0
          cnf_config: ${{ matrix.layout == 'pss' && '.github/cnti/cnti-testsuite-pss.yaml' || '.github/cnti/cnti-testsuite.yaml' }}
          kind_config: .github/cnti/kind-3workers.yaml
          tests: increase_decrease_capacity node_drain
          log_level: info
          fail_on_failure: false
      - name: Summary
        if: always()
        run: |
          sleep 6
          kubectl get events -n sdcore --sort-by=.lastTimestamp > /tmp/diag/events.log 2>&1 || true
          echo "== long-running operations seen on the primary:"; grep "^ops on primary" /tmp/diag/status.log | grep -v ": none$" | sort | uniq -c | sort -rn | head -15 | cut -c1-260
          echo "== replica-set states seen:"; grep "^rs:" /tmp/diag/status.log | sort | uniq -c | sort -rn | head -10
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "diag-${{ matrix.layout }}", path: /tmp/diag}
